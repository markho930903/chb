[package]
name = "codex-headroom-bridge"
version = "0.4.1"
edition = "2024"
description = "Route Codex Desktop through Headroom while preserving provider switching."

[[bin]]
name = "chb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
plist = "1.10"
signal-hook = "0.3"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
